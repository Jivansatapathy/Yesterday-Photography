<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4D03F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>
  
  <!-- Large camera icon in center -->
  <g transform="translate(600, 315)">
    <!-- Camera body -->
    <rect x="-120" y="-80" width="240" height="160" fill="none" stroke="url(#goldGradient)" stroke-width="8" rx="8"/>
    <!-- Lens outer ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#goldGradient)" stroke-width="6"/>
    <!-- Lens inner -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
    <circle cx="0" cy="0" r="20" fill="url(#goldGradient)"/>
    <!-- Decorative lines -->
    <path d="M -180 0 L -120 0" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 120 0 L 180 0" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Brand text -->
  <text x="600" y="500" font-family="serif" font-size="72" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle">
    Yesterday
  </text>
  <text x="600" y="560" font-family="sans-serif" font-size="32" fill="#ffffff" text-anchor="middle" opacity="0.8">
    Luxury Wedding Photography &amp; Cinematic Films
  </text>
</svg>

